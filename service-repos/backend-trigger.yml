# =============================================================
# [four-leaf-backend] CD 트리거
# 경로: .github/workflows/trigger-cd.yml
#
# main 브랜치 push + CI 통과 시:
#   1. Maven 빌드 & 테스트 (CI)
#   2. Docker 이미지 빌드 & AWS ECR push
#   3. four-leaf-infra 레포에 deploy-backend 이벤트 dispatch
#
# 조직: CapstoneDesignProject1-team9
# =============================================================

name: Build & Trigger CD

on:
  push:
    branches: [main]

env:
  NCR_REGISTRY: my-ncr.kr.ncr.ntruss.com
  IMAGE_NAME: four-leaf-backend

jobs:
  # ────────────────────────────────────────
  # Step 1: CI (Maven 빌드 & 테스트)
  # ────────────────────────────────────────
  ci:
    name: CI — Maven Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn verify -B
        env:
          SPRING_PROFILES_ACTIVE: test

  # ────────────────────────────────────────
  # Step 2: Docker 빌드 & ECR push & Infra dispatch
  # ────────────────────────────────────────
  build-and-trigger:
    name: Build Docker Image & Trigger Infra CD
    runs-on: ubuntu-latest
    needs: ci   # CI 통과 후에만 실행

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (JAR 빌드용)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Package JAR (테스트 제외, 속도 최적화)
        run: mvn package -DskipTests -B

      - name: Login to NCP Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.NCR_REGISTRY }}
          username: ${{ secrets.NCP_ACCESS_KEY }}
          password: ${{ secrets.NCP_SECRET_KEY }}

      - name: Build and push Docker image
        id: build
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t ${{ env.NCR_REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG \
            -t ${{ env.NCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.NCR_REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG
          docker push ${{ env.NCR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          echo "image=${{ env.NCR_REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "registry=${{ env.NCR_REGISTRY }}" >> $GITHUB_OUTPUT

      - name: Trigger four-leaf-infra CD
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          repository: CapstoneDesignProject1-team9/four-leaf-infra
          event-type: deploy-backend
          client-payload: |
            {
              "image_tag": "${{ github.sha }}",
              "image_uri": "${{ steps.build.outputs.image }}",
              "registry": "${{ steps.build.outputs.registry }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "actor": "${{ github.actor }}",
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

services:
  # ─────────────────────────────────────────
  # Nginx — 리버스 프록시
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: four-leaf-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - ai
    restart: unless-stopped
    networks:
      - four-leaf-net

  # ─────────────────────────────────────────
  # Frontend — React
  # ─────────────────────────────────────────
  frontend:
    image: ${FRONTEND_IMAGE:-four-leaf/frontend:latest}
    container_name: four-leaf-frontend
    ports:
      - "127.0.0.1:3000:3000"  # 호스트 health-check.sh용. 외부에는 nginx만 공개한다.
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - four-leaf-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────
  # Backend — Spring Boot
  # ─────────────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-four-leaf/backend:latest}
    container_name: four-leaf-backend
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    # environment가 env_file보다 우선한다. DB 접속 정보는 DB_* 한 곳에서만 관리한다.
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME:-fourleaf}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-fourleaf}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - AI_SERVICE_URL=http://ai:8000
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - four-leaf-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─────────────────────────────────────────
  # AI — Python / LangChain
  # ─────────────────────────────────────────
  ai:
    image: ${AI_IMAGE:-four-leaf/ai:latest}
    container_name: four-leaf-ai
    user: "${AI_CONTAINER_UID:-1000}:${AI_CONTAINER_GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-fourleaf}
      - DB_USER=${DB_USER:-fourleaf}
      - DB_PASSWORD=${DB_PASSWORD}
    env_file:
      - .env
    volumes:
      # Keep the compact RAG indexes and first-download model cache on the EC2 disk.
      # This avoids baking multi-GB model files into every application image.
      - ./ai-data/vectorstores:/app/knowledge/vectorstores
      - ./ai-data/embedding_models:/app/.cache/embedding_models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - four-leaf-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start downloads the pinned BGE-M3 snapshot into the persistent cache.
      start_period: 600s

  # ─────────────────────────────────────────
  # Database — PostgreSQL
  # ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: four-leaf-db
    environment:
      - POSTGRES_DB=${DB_NAME:-fourleaf}
      - POSTGRES_USER=${DB_USER:-fourleaf}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - four-leaf-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fourleaf}"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  postgres-data:

networks:
  four-leaf-net:
    driver: bridge

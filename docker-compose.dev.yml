# docker-compose.dev.yml — 로컬 개발 환경
# AWS 없이 로컬 Docker로 전체 스택 실행
#
# 실행 방법:
#   cd four-leaf-infra
#   cp .env.example .env.dev   # 최초 1회
#   docker compose -f docker-compose.dev.yml up -d --build
#
# 폴더 구조 가정:
#   네잎클로바/
#   ├── four-leaf-infra/     ← 이 파일 위치
#   ├── four-leaf-frontend/
#   ├── four-leaf-backend/
#   └── four-leaf-AI/

services:
  # ─────────────────────────────────────────
  # Nginx — 리버스 프록시
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: four-leaf-nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - ai
    networks:
      - four-leaf-net

  # ─────────────────────────────────────────
  # Frontend — React/Vite (개발 서버 HMR)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ../four-leaf-frontend # 실제 레포 폴더명 (오타 포함)
      dockerfile: Dockerfile.dev # 개발용 (Vite dev server)
    container_name: four-leaf-frontend-dev
    expose:
      - "3000"
    ports:
      - "3000:3000"
    volumes:
      - ../four-leaf-frontend:/app # Hot Reload를 위한 소스 마운트
      - /app/node_modules # 컨테이너 내부 node_modules 보호
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=/api
      - VITE_AI_BASE_URL=/ai
      - BACKEND_SERVICE_URL=http://backend:8080
      - AI_SERVICE_URL=http://ai:8000
    networks:
      - four-leaf-net

  # ─────────────────────────────────────────
  # Backend — Spring Boot
  # ─────────────────────────────────────────
  backend:
    build:
      context: ../four-leaf-backend
      dockerfile: Dockerfile
    container_name: four-leaf-backend-dev
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai:8000}
    env_file:
      - .env.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - four-leaf-net

  # ─────────────────────────────────────────
  # AI — Python / LangChain
  # ─────────────────────────────────────────
  ai:
    build:
      context: ../four-leaf-AI # 실제 레포 폴더명
      dockerfile: Dockerfile
    container_name: four-leaf-ai-dev
    expose:
      - "8000"
    ports:
      - "8000:8000"
    volumes:
      - ../four-leaf-AI:/app # 소스 변경 시 재시작 필요
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-fourleaf_dev}
      - DB_USER=${DB_USER:-fourleaf}
      - DB_PASSWORD=${DB_PASSWORD:-devpassword}
      # Ollama runs natively on the Mac; host.docker.internal reaches it from the container.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - VLLM_BASE_URL=${VLLM_BASE_URL:-http://vllm:8000}
      - VLLM_BASE_MODEL=${VLLM_BASE_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      - VLLM_LORA_ADAPTERS=${VLLM_LORA_ADAPTERS:-{"student-lora":"student-lora","professor-lora":"professor-lora"}}
    env_file:
      - .env.dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - four-leaf-net

  # GPU-backed vLLM OpenAI-compatible serving; start with --profile gpu.
  vllm:
    image: vllm/vllm-openai:latest
    profiles: [ "gpu" ]
    command:
      - --model
      - ${VLLM_BASE_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      - --enable-lora
      - --max-loras
      - "2"
      - --max-lora-rank
      - ${VLLM_MAX_LORA_RANK:-64}
      - --lora-modules
      - student-lora=${VLLM_STUDENT_LORA_PATH:-/models/student-lora}
      - professor-lora=${VLLM_PROFESSOR_LORA_PATH:-/models/professor-lora}
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - ${VLLM_STUDENT_LORA_HOST_PATH:-../four-leaf-AI/models/student-lora/adapter_student_llama}:/models/student-lora:ro
      - ${VLLM_PROFESSOR_LORA_HOST_PATH:-../four-leaf-AI/models/professor-lora/adapter_professor_llama}:/models/professor-lora:ro
      - huggingface-cache:/root/.cache/huggingface
    ports:
      - "8001:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks:
      - four-leaf-net

  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: four-leaf-db-dev
    ports:
      - "5432:5432" # 로컬에서 직접 접속 가능 (DBeaver 등)
    environment:
      - POSTGRES_DB=${DB_NAME:-fourleaf_dev}
      - POSTGRES_USER=${DB_USER:-fourleaf}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-devpassword}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - four-leaf-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-fourleaf}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: four-leaf-redis-dev
    ports:
      - "6379:6379" # 로컬에서 직접 접속 가능
    command: redis-server --requirepass ${REDIS_PASSWORD:-devpassword}
    networks:
      - four-leaf-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-dev-data:
  huggingface-cache:

networks:
  four-leaf-net:
    driver: bridge

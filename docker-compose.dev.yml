# docker-compose.dev.yml — 로컬 개발 환경
# AWS 없이 로컬 Docker로 전체 스택 실행
#
# 실행 방법:
#   cd four-leaf-infra
#   cp .env.example .env.dev   # 최초 1회
#   docker compose -f docker-compose.dev.yml up -d --build
#
# 폴더 구조 가정:
#   네잎클로바/
#   ├── four-leaf-infra/     ← 이 파일 위치
#   ├── four-laef-frontend/
#   ├── four-leaf-backend/
#   └── four-leaf-AI/

services:
  # ─────────────────────────────────────────
  # Nginx — 리버스 프록시
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: four-leaf-nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - ai
    networks:
      - four-leaf-net

  # ─────────────────────────────────────────
  # Frontend — React/Vite (개발 서버 HMR)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ../four-laef-frontend   # 실제 레포 폴더명 (오타 포함)
      dockerfile: Dockerfile.dev        # 개발용 (Vite dev server)
    container_name: four-leaf-frontend-dev
    expose:
      - "3000"
    volumes:
      - ../four-laef-frontend:/app      # Hot Reload를 위한 소스 마운트
      - /app/node_modules               # 컨테이너 내부 node_modules 보호
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=/api
      - VITE_AI_BASE_URL=/ai
    networks:
      - four-leaf-net

  # ─────────────────────────────────────────
  # Backend — Spring Boot
  # ─────────────────────────────────────────
  backend:
    build:
      context: ../four-leaf-backend
      dockerfile: Dockerfile
    container_name: four-leaf-backend-dev
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    env_file:
      - .env.dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - four-leaf-net

  # ─────────────────────────────────────────
  # AI — Python / LangChain
  # ─────────────────────────────────────────
  ai:
    build:
      context: ../four-leaf-AI          # 실제 레포 폴더명
      dockerfile: Dockerfile
    container_name: four-leaf-ai-dev
    expose:
      - "8000"
    volumes:
      - ../four-leaf-AI:/app            # 소스 변경 시 재시작 필요
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=development
    env_file:
      - .env.dev
    networks:
      - four-leaf-net

  # ─────────────────────────────────────────
  # PostgreSQL
  # ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: four-leaf-db-dev
    ports:
      - "5432:5432"   # 로컬에서 직접 접속 가능 (DBeaver 등)
    environment:
      - POSTGRES_DB=${DB_NAME:-fourleaf_dev}
      - POSTGRES_USER=${DB_USER:-fourleaf}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-devpassword}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - four-leaf-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fourleaf}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: four-leaf-redis-dev
    ports:
      - "6379:6379"   # 로컬에서 직접 접속 가능
    command: redis-server --requirepass ${REDIS_PASSWORD:-devpassword}
    networks:
      - four-leaf-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-dev-data:

networks:
  four-leaf-net:
    driver: bridge

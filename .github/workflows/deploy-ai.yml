name: Deploy AI

on:
  # four-leaf-AI 레포에서 보내는 dispatch 이벤트
  repository_dispatch:
    types: [deploy-ai]
  # 수동 트리거
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (default: latest)"
        required: false
        default: "latest"

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    name: Deploy AI Service to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "IMAGE_TAG=${{ github.event.client_payload.image_tag }}" >> $GITHUB_ENV
            echo "SHA=${{ github.event.client_payload.sha }}" >> $GITHUB_ENV
            echo "ACTOR=${{ github.event.client_payload.actor }}" >> $GITHUB_ENV
            echo "TRIGGER_URL=${{ github.event.client_payload.run_url }}" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=${{ github.event.inputs.image_tag || 'latest' }}" >> $GITHUB_ENV
            echo "SHA=manual" >> $GITHUB_ENV
            echo "ACTOR=${{ github.actor }}" >> $GITHUB_ENV
            echo "TRIGGER_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.AWS_REGION }}
          IMAGE_NAME: four-leaf-ai
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          AI_RAG_S3_URI: ${{ secrets.AI_RAG_S3_URI }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: ECR_REGISTRY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,IMAGE_NAME,IMAGE_TAG,AI_RAG_S3_URI
          script: |
            set -e
            cd ~/four-leaf-infra

            : "${AI_RAG_S3_URI:?Set the infra repository secret AI_RAG_S3_URI to the S3 prefix containing the Chroma indexes}"

            # Sync only the compact Chroma indexes. The embedding model is downloaded
            # from Hugging Face on first start and kept in the persistent host cache.
            mkdir -p ai-data/vectorstores ai-data/embedding_models
            aws s3 sync "$AI_RAG_S3_URI" ai-data/vectorstores
            test -f ai-data/vectorstores/knu_notice_bge_m3/chroma.sqlite3 || {
              echo "Missing required Chroma index: knu_notice_bge_m3/chroma.sqlite3" >&2
              exit 1
            }

            NEW_IMAGE="${ECR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
            echo "▶ 배포할 이미지: $NEW_IMAGE"

            # ECR 로그인
            aws ecr get-login-password --region "$AWS_REGION" | \
              docker login --username AWS --password-stdin "$ECR_REGISTRY"

            # .env 파일 업데이트
            if grep -q "^AI_IMAGE=" .env 2>/dev/null; then
              sed -i "s|^AI_IMAGE=.*|AI_IMAGE=${NEW_IMAGE}|" .env
            else
              echo "AI_IMAGE=${NEW_IMAGE}" >> .env
            fi

            # Match the bind-mounted cache/index ownership to the remote deploy user.
            for KEY_VALUE in "AI_CONTAINER_UID=$(id -u)" "AI_CONTAINER_GID=$(id -g)"; do
              KEY="${KEY_VALUE%%=*}"
              VALUE="${KEY_VALUE#*=}"
              if grep -q "^${KEY}=" .env 2>/dev/null; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" .env
              else
                echo "${KEY}=${VALUE}" >> .env
              fi
            done

            # 새 이미지 pull & 서비스 재시작
            docker compose pull ai
            docker compose up -d --no-deps --remove-orphans ai

            # 이전 이미지 정리
            docker image prune -f > /dev/null 2>&1 || true

            # 헬스체크
            bash scripts/health-check.sh ai

